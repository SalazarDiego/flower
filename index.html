<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="img/flowers.png" type="image/x-icon">
    <title>Flowers</title>
</head>

<body>
    <div class="greetings">
        <span>H</span>
        <span>o</span>
        <span>l</span>
        <span>a</span>
        <span>!</span>
    </div>
    <div class="description">
        <span>ESTE DETALLE ES PARA TI EVI :)</span>
    </div>
    <div class="button">
        <button class="botones" id="entrar">
            <a href="flower.html" style="color: #fff;">CLICK AQUÍ</a>
        </button>
    </div>

    <script>
        // El clic se conserva como interacción del usuario antes de navegar.
        // La página flower.html hará un segundo intento de autoplay y mostrará
        // un botón de fallback si Android/iPhone lo bloquea.
        document.getElementById('entrar').addEventListener('click', function () {
            sessionStorage.setItem('entroDesdeBoton', '1');
        });
    </script>
</body>

</html>
